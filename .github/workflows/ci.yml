name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci.db
          JWT_SECRET: ci-only-not-a-real-secret
          APP_ENV: test
        run: pytest -q

      - name: Check migrations apply cleanly
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./migration-check.db
          JWT_SECRET: ci-only-not-a-real-secret
        run: alembic upgrade head

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install browser workflow dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          npx playwright install --with-deps chromium

      - name: Browser acceptance
        working-directory: frontend
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-browser-results
          path: |
            frontend/playwright-report
            frontend/test-results

  postgres-migrations:
    name: PostgreSQL migrations and browser permissions
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ceoai
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ceoai_browser_fixture
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ceoai -d ceoai_browser_fixture"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Migrate pgvector and exercise browser permissions
        working-directory: frontend
        env:
          CEOAI_E2E_POSTGRES: "1"
          CEOAI_E2E_HUBSPOT: "1"
          CEOAI_E2E_DATABASE_URL: postgresql+psycopg://ceoai:ci-only-password@127.0.0.1:5432/ceoai_browser_fixture
        run: npm run test:e2e -- approvals.spec.ts experiments.spec.ts csv-imports.spec.ts
      - name: Verify stored pgvector embeddings
        working-directory: backend
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: ceoai
          PGPASSWORD: ci-only-password
          PGDATABASE: ceoai_browser_fixture
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import psycopg
          from app.embeddings import _hashing_embedding

          fixture = "Apportionment requires a signed procurement worksheet."
          query = json.dumps(_hashing_embedding("apportionment"))
          with psycopg.connect() as db:
              extension = db.execute("SELECT extversion FROM pg_extension WHERE extname = 'vector'").fetchone()
              assert extension, "The vector extension was not installed by the migrations"
              index = db.execute("""
                  SELECT indexdef FROM pg_indexes WHERE schemaname = current_schema()
                  AND tablename = 'knowledge_chunks' AND indexname = 'ix_knowledge_chunks_vector'
              """).fetchone()
              assert index and "USING hnsw" in index[0] and "vector_cosine_ops" in index[0], index
              session = db.execute("""
                  SELECT session_id FROM knowledge_chunks WHERE content = %s
              """, (fixture,)).fetchone()
              assert session, "The browser fixture did not persist its document chunk"
              chunk = db.execute("""
                  SELECT content, vector_dims(embedding), embedding <=> %s::vector AS distance
                  FROM knowledge_chunks WHERE session_id = %s
                  ORDER BY distance LIMIT 1
              """, (query, session[0])).fetchone()
              assert chunk and chunk[0] == fixture and chunk[1] == 256 and 0 <= chunk[2] < 1, chunk
              receipt = {
                  "extension_version": extension[0],
                  "embedding_dimensions": chunk[1],
                  "cosine_distance": chunk[2],
                  "browser_fixture_rank": 1,
                  "hnsw_cosine_index_present": True,
              }
              output = Path("../frontend/test-results/pgvector-receipt.json")
              output.parent.mkdir(parents=True, exist_ok=True)
              output.write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
              print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-postgres-browser-results
          path: |
            frontend/playwright-report
            frontend/test-results
